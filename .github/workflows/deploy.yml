name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build for PNTR custom domain
        env:
          PAGES_BUILD: 'true'
        run: npm run build
      - name: Verify generated blog routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('dist')
          index = root / 'blog' / 'index.html'
          assert index.is_file(), 'Missing /blog/ index page'
          routes = [
              path for path in (root / 'blog').glob('*/index.html')
              if path.parent.name != 'topics'
          ]
          assert routes, 'No Sanity blog post routes were generated'
          print(f'Validated {len(routes)} generated blog post routes')
          PY
      - name: Preserve static assets
        run: touch dist/.nojekyll
      - name: Validate generated stylesheets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          root = Path('dist').resolve()
          class Styles(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.inline = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'style':
                      self.inline = True
                  if tag == 'link' and 'stylesheet' in attrs.get('rel', '').split():
                      self.links.append(attrs.get('href', ''))
          pages = list(root.rglob('*.html'))
          assert pages, 'No HTML generated'
          for page in pages:
              parser = Styles()
              parser.feed(page.read_text())
              local = 0
              for href in parser.links:
                  url = urlsplit(href)
                  if url.scheme or url.netloc:
                      continue
                  local += 1
                  path = unquote(url.path)
                  asset = root / path.lstrip('/') if path.startswith('/') else page.parent / path
                  assert asset.is_file() and asset.stat().st_size, f'{page}: missing CSS: {href}'
              assert local or parser.inline, f'{page}: no local or inline CSS'
          print(f'Validated stylesheets in {len(pages)} HTML pages')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
